name: Build Push and Deploy via ArgoCD (Selective)

on:
  push:
    branches:
      - gitops
    paths:
      - 'backend/**'
      - 'talent-directory/**'
      - 'k8s/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 208851973284
  ECR_REGISTRY: 208851973284.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPOSITORY: b17-frontend
  BACKEND_REPOSITORY: b17-backend
  FRONTEND_IMAGE_NAME: 208851973284.dkr.ecr.ap-south-1.amazonaws.com/b17-frontend
  BACKEND_IMAGE_NAME: 208851973284.dkr.ecr.ap-south-1.amazonaws.com/b17-backend
  GITOPS_BRANCH: gitops

jobs:
  build-push-update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for git diff

      - name: Detect changed services
        id: changes
        run: |
          # Default to false
          FRONTEND_CHANGED=false
          BACKEND_CHANGED=false

          # When workflow_dispatch, treat both as changed (manual deploy)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FRONTEND_CHANGED=true
            BACKEND_CHANGED=true
          else
            # Compare last commit to previous one on this branch
            DIFF_RANGE="${{ github.event.before }}..${{ github.sha }}"
            echo "Diff range: ${DIFF_RANGE}"

            if git diff --name-only ${DIFF_RANGE} | grep -q '^talent-directory/'; then
              FRONTEND_CHANGED=true
              echo "Frontend changes detected"
            fi

            if git diff --name-only ${DIFF_RANGE} | grep -q '^backend/'; then
              BACKEND_CHANGED=true
              echo "Backend changes detected"
            fi
          fi

          echo "frontend-changed=${FRONTEND_CHANGED}" >> $GITHUB_OUTPUT
          echo "backend-changed=${BACKEND_CHANGED}" >> $GITHUB_OUTPUT

          if [ "$FRONTEND_CHANGED" = "false" ] && [ "$BACKEND_CHANGED" = "false" ]; then
            echo "No relevant service changes detected"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE_NAME}:${TAG}" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${BACKEND_IMAGE_NAME}:${TAG}" >> $GITHUB_ENV

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names "${FRONTEND_REPOSITORY}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${FRONTEND_REPOSITORY}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

          aws ecr describe-repositories --repository-names "${BACKEND_REPOSITORY}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${BACKEND_REPOSITORY}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Build frontend image
        if: steps.changes.outputs.frontend-changed == 'true'
        run: |
          echo "Building frontend image: ${FRONTEND_IMAGE}"
          docker build -t "${FRONTEND_IMAGE}" -t "${FRONTEND_IMAGE_NAME}:latest" ./talent-directory

      - name: Build backend image
        if: steps.changes.outputs.backend-changed == 'true'
        run: |
          echo "Building backend image: ${BACKEND_IMAGE}"
          docker build -t "${BACKEND_IMAGE}" -t "${BACKEND_IMAGE_NAME}:latest" ./backend

      - name: Push frontend image
        if: steps.changes.outputs.frontend-changed == 'true'
        run: |
          docker push "${FRONTEND_IMAGE}"
          docker push "${FRONTEND_IMAGE_NAME}:latest"

      - name: Push backend image
        if: steps.changes.outputs.backend-changed == 'true'
        run: |
          docker push "${BACKEND_IMAGE}"
          docker push "${BACKEND_IMAGE_NAME}:latest"

      - name: Update frontend manifest image
        if: steps.changes.outputs.frontend-changed == 'true'
        run: |
          sed -i "s|image:.*|image: ${FRONTEND_IMAGE}|g" k8s/frontend-deployment.yaml
          echo "Updated frontend deployment image to ${FRONTEND_IMAGE}"
          grep -n "image:" k8s/frontend-deployment.yaml || true

      - name: Update backend manifest image
        if: steps.changes.outputs.backend-changed == 'true'
        run: |
          sed -i "s|image:.*|image: ${BACKEND_IMAGE}|g" k8s/backend-deployment.yaml
          echo "Updated backend deployment image to ${BACKEND_IMAGE}"
          grep -n "image:" k8s/backend-deployment.yaml || true

      - name: Commit manifest changes
        run: |
          git config --local user.email "gitops@github.com"
          git config --local user.name "GitOps Bot"

          CHANGED_FILES=()

          if [ "${{ steps.changes.outputs.frontend-changed }}" = "true" ]; then
            CHANGED_FILES+=("k8s/frontend-deployment.yaml")
          fi
          if [ "${{ steps.changes.outputs.backend-changed }}" = "true" ]; then
            CHANGED_FILES+=("k8s/backend-deployment.yaml")
          fi

          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "No manifest files to commit"
            exit 0
          fi

          git add "${CHANGED_FILES[@]}"
          git commit -m "Deploy frontend=${TAG} backend=${TAG} (selective)"
          git push origin "${GITOPS_BRANCH}"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${GITOPS_BRANCH}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changes.outputs.frontend-changed }}" = "true" ]; then
            echo "- Frontend image: ${FRONTEND_IMAGE}" >> $GITHUB_STEP_SUMMARY
            echo "- Updated: k8s/frontend-deployment.yaml" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Frontend: no changes" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.changes.outputs.backend-changed }}" = "true" ]; then
            echo "- Backend image: ${BACKEND_IMAGE}" >> $GITHUB_STEP_SUMMARY
            echo "- Updated: k8s/backend-deployment.yaml" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Backend: no changes" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ArgoCD will sync from branch: ${GITOPS_BRANCH}" >> $GITHUB_STEP_SUMMARY