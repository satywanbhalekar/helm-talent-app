apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: talent-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
  spec:
      containers:
        - name: backend
          image: IMAGE_BACKEND
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: backend-secret