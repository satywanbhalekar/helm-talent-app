services:
  frontend:
    build:
      context: ./talent-directory
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./talent-directory/.env
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
