services:
  frontend:
    container_name: frontend
    build: ./talent-directory
    env_file:
      - ./talent-directory/.env
    depends_on:
      - backend

  backend:
    container_name: backend
    build: ./backend
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      

